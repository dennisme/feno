name: markdownlint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/markdownlint.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/markdownlint.yaml"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md

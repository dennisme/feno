name: Go Test

on:
  push:
    tags:
      - v*
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Beyond the workflow's own: actions to read and write the stored coverage
    # report, which is held as an artifact, and pull-requests to comment the
    # delta. A fork's token is read only whatever this asks for, so the comment
    # is refused there and octocov writes a job summary instead.
    permissions:
      contents: read
      pull-requests: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Only promtool, because setup-go already provided the toolchain and the
      # rest of .tool-versions belongs to recipes this job does not run. The
      # pin is what matters: the promtool that checks the generated rules here
      # is the one a contributor gets from `just init`.
      - name: Install pinned promtool
        uses: jdx/mise-action@v5
        with:
          install_args: promtool

      - name: Install dependencies
        run: go mod download

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

      - name: Build
        run: just build

      - name: Unit tests
        run: just test

      - name: Check generated rules
        run: just promtool

      # Separate from the test step because the race detector and the coverage
      # instrumentation are different builds, and the number reported has to
      # come from a run that measured every package.
      - name: Coverage
        run: just coverage

      # Configured in .octocov.yml. On main it stores the number a pull
      # request's delta is measured against; on a pull request it reads that
      # back and comments the difference.
      - name: Report coverage
        uses: k1LoW/octocov-action@v1

  # Its own job because what it proves is not a unit: two Prometheus servers
  # come up, and one that will not should read as that rather than as a failing
  # test. It needs no secrets and pulls public images, so it runs on a fork
  # pull request as well as on main.
  smoketest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Probe two real Prometheus servers
        run: just smoketest

# Generated by feno. Do not edit.
#
# Evaluation interval: 1m
# queue-depth: robust, mad_over_time, window 30m
#
groups:
  - name: anomaly-queue_depth
    interval: 1m
    rules:
      - record: anomaly:queue_depth:level
        expr: sum(kafka_consumergroup_lag{consumergroup="annotator"})
      - record: anomaly:queue_depth:centre
        expr: quantile_over_time(0.5, anomaly:queue_depth:level[30m])
      - record: anomaly:queue_depth:scale
        expr: 1.4826 * mad_over_time(anomaly:queue_depth:level[30m])
      - record: anomaly:queue_depth:half_width
        expr: 2 * anomaly:queue_depth:scale
      - record: anomaly:queue_depth:upper_band
        expr: anomaly:queue_depth:centre + anomaly:queue_depth:half_width
      - record: anomaly:queue_depth:lower_band
        expr: anomaly:queue_depth:centre - anomaly:queue_depth:half_width
      - alert: AnomalyDetected
        expr: |-
          anomaly:queue_depth:level > anomaly:queue_depth:upper_band or anomaly:queue_depth:level < anomaly:queue_depth:lower_band
        for: 5m
        labels:
          anomaly_detector: queue-depth

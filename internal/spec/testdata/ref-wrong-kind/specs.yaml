apiVersion: openslo/v1
kind: Service
metadata:
  name: mimir-prod
spec:
  description: A Service that happens to share a name with nothing useful
---
apiVersion: anomaly.openslo.io/v1alpha
kind: AnomalyDetector
metadata:
  name: checkout-request-rate
spec:
  indicator:
    metadata:
      name: checkout-requests
    spec:
      thresholdMetric:
        metricSource:
          metricSourceRef: mimir-prod
          spec:
            query: sum(rate(http_requests_total[5m]))
  detection:
    strategy: adaptive
    class: requests
    sensitivity: balanced
